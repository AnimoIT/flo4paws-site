# Flo4Paws static site. Serves staging.flo4paws.co.uk now and www.flo4paws.co.uk
# once the A record moves (WBL-654). Same vhost, no config change on the day except
# certbot expanding the certificate and one add_header line leaving the snippet.
# W5 (WBL-654): the apex flo4paws.co.uk was on Wix too, so it is added on both
# ports and 301s to www; the cert is expanded to all three names on the day.
# REVIEW BEFORE APPLYING. nginx -t must pass before any reload.
# This nginx also serves app.flo4paws.co.uk (Flo production + Lily). A bad
# reload takes both down. G-2 notification applies.

server {
    server_name staging.flo4paws.co.uk www.flo4paws.co.uk flo4paws.co.uk;
    root /var/www/flo4paws-site;
    index index.html;
    if ($host = flo4paws.co.uk) {
        return 301 https://www.flo4paws.co.uk$request_uri;
    }

    include /etc/nginx/snippets/flo4paws-site-headers.conf;

    # Dotfiles (.git, .env, .htaccess ...) never leave the box. ACME excepted.
    # Same pattern as the app vhost.
    location ~ /\.(?!well-known) { return 404; }

    # HTML: always revalidate. ETag/Last-Modified make the repeat cost a 304.
    location / {
        include /etc/nginx/snippets/flo4paws-site-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        include /etc/nginx/snippets/flo4paws-site-headers.conf;
        expires 30d; add_header Cache-Control "public, immutable";
    }
    location = /site.css {
        include /etc/nginx/snippets/flo4paws-site-headers.conf;
        expires 7d; add_header Cache-Control "public";
    }

    # ---- 301 map. Authority preservation. Do not delete any of these. ----
    location = /post/how-the-tellington-ttouch-harness-transformed-my-nervous-dog-s-walks-a-pawsitively-groundbreaking { return 301 /guides/tellington-ttouch-harness/; }
    location = /tellington-touch                { return 301 /guides/tellington-ttouch-harness/; }
    location = /pickpocket-foragers             { return 301 /guides/enrichment-and-freework/; }
    location = /muzzle-movement                 { return 301 /guides/muzzle-training/; }
    location = /tug-e-nuff                      { return 301 /guides/tug-toys-and-confidence/; }
    location = /pet-remedy                      { return 301 /guides/calming-products-for-anxious-dogs/; }
    location = /green-and-wilds                 { return 301 /guides/natural-chews/; }
    location = /international-canine            { return 301 /guides/international-canine/; }

    location = /gunthorpe-river-trent           { return 301 /walks/gunthorpe-river-trent/; }
    location = /houghton-on-the-hill            { return 301 /walks/houghton-on-the-hill/; }
    location = /rufford-park-and-sherwood-forest { return 301 /walks/rufford-park-and-sherwood-forest/; }
    location = /walkies                         { return 301 /walks/; }

    location = /my-services                     { return 301 /how-it-works/; }
    location = /my-servicesold                  { return 301 /how-it-works/; }
    location = /contact                         { return 301 /contact/; }
    location = /code-of-ethics                  { return 301 /code-of-ethics/; }
    location = /customer-testimonials           { return 301 /reviews/; }
    location = /flos-friends                    { return 301 /flos-friends/; }
    location = /blog                            { return 301 /guides/; }
    location = /blog/categories/walks           { return 301 /walks/; }
    location = /copy-of-contact-thank-you       { return 301 /contact/; }
    location = /general-4                       { return 301 /; }
    location = /post/diego-has-found-his-forever-home { return 301 /reviews/; }
    location = /post/can-i-go-swimming-mum      { return 301 /guides/; }

    # Health and history form now lives in the ClientFlex intake form
    # (real-actor-proven, W3 ruling). Wix /healthform retires at cutover.
    location = /healthform                      { return 301 https://app.flo4paws.co.uk/intake-form/flo4paws/; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.flo4paws.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.flo4paws.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = staging.flo4paws.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = www.flo4paws.co.uk) {
        return 301 https://$host$request_uri;
    }
    if ($host = flo4paws.co.uk) {
        return 301 https://www.flo4paws.co.uk$request_uri;
    }


    listen 80;
    server_name staging.flo4paws.co.uk www.flo4paws.co.uk flo4paws.co.uk;
    return 404; # managed by Certbot


}
