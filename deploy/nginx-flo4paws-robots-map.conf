# Flo4Paws static site: X-Robots-Tag value by host (WBL-660). http context, so it lives in
# /etc/nginx/conf.d/flo4paws-robots-map.conf, installed from flo4paws-site/deploy/. Keep identical.
# Consumed by snippets/flo4paws-site-headers.conf. Empty string = header not sent.
map $host $f4p_robots {
    default                   "";
    staging.flo4paws.co.uk    "noindex, nofollow";
}
