# Flo4Paws static site — response headers.
# Installed at /etc/nginx/snippets/flo4paws-site-headers.conf from
# flo4paws-site/deploy/nginx-flo4paws-headers.conf. Keep them identical.
#
# nginx add_header REPLACES the inherited set inside any block that sets its own
# add_header, so this file is included at server level AND inside every location
# that adds a header. Edit here, never in the vhost.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# LAUNCH (BL-654): remove the line below in the same change that moves the www
# A record. It is the only thing keeping this estate out of the index.
add_header X-Robots-Tag "noindex, nofollow" always;
